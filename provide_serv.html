<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simple Form</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7fc;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      width: 100%;
      text-align: center;
      margin-bottom: 2rem;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #333;
      padding: 1rem 2rem;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
    }
    .logo a {
      color: white;
      font-size: 2rem;
      text-decoration: none;
    }
    .nav-links {
      list-style: none;
      display: flex;
    }
    .nav-links li {
      margin: 0 1rem;
    }
    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 1rem;
      padding: 0.5rem;
      transition: background-color 0.3s ease;
    }
    .nav-links a:hover {
      background-color: #575757;
      border-radius: 0.5rem;
    }
    .hamburger {
      display: none;
      cursor: pointer;
      flex-direction: column;
      gap: 4px;
      width: 30px;
      height: 25px;
      position: absolute;
      right: 1rem;
      top: 1rem;
    }
    .hamburger div {
      background-color: white;
      height: 4px;
      width: 100%;
      transition: all 0.3s ease;
    }
    @media (max-width: 768px) {
      .nav-links {
        flex-direction: column;
        display: none;
        width: 100%;
        margin-top: 1rem;
        padding: 0;
      }
      .nav-links.active {
        display: flex;
      }
      .nav-links li {
        margin: 1rem 0;
        text-align: center;
      }
      .hamburger {
        display: flex;
      }
    }
    input {
      width: 50vw;
      padding: 1rem;
      margin-bottom: 1.5rem;
      border-radius: 0.5rem;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
      width: 50vw;
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo"><a href="mainn.html">MyLogo</a></div>
      <div class="hamburger" id="hamburger">
        <div></div><div></div><div></div>
      </div>
      <ul class="nav-links">
        <li><a href="your_services.html">Your-posts</a></li>
        <li><a href="serv_boys.html">Add service</a></li>
        <li><a href="items/help.html">Help</a></li>
        <li><a href="items/contact.html">Contact</a></li>
        <li><a href="AdminProfile.html">profile</a></li>
      </ul>
    </nav>
  </header>

  <input type="text" placeholder="Enter Name of Org" id="inpProductName">
  <input type="text" placeholder="Enter Category" id="inpProductDesc">
  <input type="number" placeholder="Enter Price Per Head" id="inpProductPrice">
  <input type="text" placeholder="Type of Functions" id="inpProductCategory">
  <input type="text" placeholder="Enter Items" id="inpStockQuantity">
  <input type="text" placeholder="location" id="info">
  
  <input type="number" placeholder="Enter Contact Number" id="cell">
  <input type="file" id="inpProductImage">
  <button id="btnAddProduct">Add Product</button>

  <input type="text" placeholder="Update Your Org" id="inpSearchName">
  <input type="text" placeholder="Enter New Description" id="inpNewProductDesc">
  <input type="text" placeholder="Enter New Category" id="inpNewProductcategory">
  <input type="number" placeholder="Enter New Price" id="inpNewProductPrice">
  <input type="number" placeholder="Enter New Stock" id="inpnewStockQuantity">
  <button id="btnUpdateProduct">Update Product</button>

  <input type="text" placeholder="Enter Product Name to Delete" id="inpDeleteName">
  <button id="btnDeleteProduct">Delete Product</button>

  <script type="module">
    const hamburger = document.getElementById("hamburger");
    const navLinks = document.querySelector(".nav-links");
    hamburger.addEventListener("click", () => {
      navLinks.classList.toggle("active");
    });

    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCV1eiwKVZs1inaWkVTYVsisI3sIIlAGL0",
      authDomain: "crud-dd0b4.firebaseapp.com",
      projectId: "crud-dd0b4",
      storageBucket: "crud-dd0b4.appspot.com",
      messagingSenderId: "818921146981",
      appId: "1:818921146981:web:dbbdba5635bcdf78d3548c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const currentAdminEmail = "admin@example.com"; // Replace with actual admin logic
    const arr = JSON.parse(localStorage.getItem("Caters")) || [];

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = (error) => reject(error);
        reader.readAsDataURL(file);
      });
    }

    document.getElementById("btnAddProduct").addEventListener("click", async () => {
      const user = auth.currentUser;
      if (!user) return alert("Please sign in to add products.");

      const name = inpProductName.value;
      const desc = inpProductDesc.value;
      const price = inpProductPrice.value;
      const category = inpProductCategory.value;
      const stock = inpStockQuantity.value;
      const info = document.getElementById("info").value;
      const cell = document.getElementById("cell").value;
      const imageFile = document.getElementById("inpProductImage").files[0];

    //   if (!name || !desc || !price || !category || !stock || !imageFile) {
    //     return alert("Please fill all fields.");
    //   }

      const base64Image = await readFileAsBase64(imageFile);
      const productData = {
        name, description: desc, price, category, stock, info, cell,
        image: base64Image,
        adminEmail: currentAdminEmail
      };

      await addDoc(collection(db, "productsList"), productData);
      arr.push(productData);
      localStorage.setItem("Caters", JSON.stringify(arr));
      alert("Product added successfully.");
    });

    document.getElementById("btnUpdateProduct").addEventListener("click", async () => {
      const searchName = document.getElementById("inpSearchName").value;
      const newDesc = document.getElementById("inpNewProductDesc").value;
      const newCategory = document.getElementById("inpNewProductcategory").value;
      const newPrice = document.getElementById("inpNewProductPrice").value;
      const newStock = document.getElementById("inpnewStockQuantity").value;

      if (!searchName || !newDesc || !newPrice) {
        return alert("Fill all update fields.");
      }

      const q = query(collection(db, "productsList"), where("name", "==", searchName), where("adminEmail", "==", currentAdminEmail));
      const snapshot = await getDocs(q);
      if (snapshot.empty) return alert("No product found.");

      snapshot.forEach(async (docSnap) => {
        await updateDoc(docSnap.ref, {
          description: newDesc,
          price: newPrice,
          category: newCategory,
          stock: newStock
        });
      });
      alert("Product updated.");
    });

    document.getElementById("btnDeleteProduct").addEventListener("click", async () => {
      const deleteName = document.getElementById("inpDeleteName").value;
      if (!deleteName) return alert("Enter a product name.");

      const q = query(collection(db, "productsList"), where("name", "==", deleteName), where("adminEmail", "==", currentAdminEmail));
      const snapshot = await getDocs(q);
      if (snapshot.empty) return alert("No product found.");

      snapshot.forEach(async (docSnap) => {
        await deleteDoc(docSnap.ref);
      });
      alert("Product deleted.");
    });
  </script>
</body>
</html>
