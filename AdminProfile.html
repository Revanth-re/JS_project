<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }

    .profile-container {
      max-width: 400px;
      margin: 80px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }

    .profile-photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      border: 4px solid #4a90e2;
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    .profile-details p {
      font-size: 16px;
      color: #555;
      margin: 8px 0;
    }

    #logoutLink {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #ff4d4f;
      color: white;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    #logoutLink:hover {
      background-color: #d9363e;
    }
    </style>
</head>
<body>
    <div id="div"> lrewq</div>
    <script>
        let data2 = JSON.parse(localStorage.getItem("FirstandLastNames")) || [];
    
        console.log(data2);
    
        data2.forEach(val => {
          const name = document.createElement("p");
          name.innerText = `Name: ${val.email}`;
    
          const first = document.createElement("p");
          first.innerText = `First Name: ${val.firstname}`;
    
          const second = document.createElement("p");
          second.innerText = `Last Name: ${val.lastname}`;
    
          document.body.append(first, second, name);
        });
    
        // Logout link (optional logic)
        document.getElementById("logoutLink").addEventListener("click", () => {
          localStorage.clear();
          alert("You have been logged out!");
          window.location.href = "index.html"; // redirect to homepage or login
        });
      </script>
     
</body>
</html>
