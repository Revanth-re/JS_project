<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }

    /* Navbar styles */
    .navbar {
      display: flex;
      align-items: center;
      background-color: #000000;
      color: white;
      padding: 15px 20px;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-size: 24px;
      margin-right: 20px;
    }

    .navbar-title {
      font-size: 20px;
      font-weight: bold;
    }

    /* Main content after navbar */
    .profile-container {
      max-width: 400px;
      margin: 100px auto 40px; /* margin-top adjusted because of fixed navbar */
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }

    .profile-photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      border: 4px solid #4a90e2;
      cursor: pointer;
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    .profile-details p {
      font-size: 16px;
      color: #555;
      margin: 8px 0;
    }

    #logoutLink {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #ff4d4f;
      color: white;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    #logoutLink:hover {
      background-color: #d9363e;
    }

    #uploadInput {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <a href="mainn.html"><i class="fa-solid fa-arrow-left"></i></a> <!-- Left Arrow Link to Home or Previous page -->
    <div class="navbar-title"></div>
  </div>

  <!-- Profile Card -->
  <div class="profile-container">
    <label for="uploadInput">
      <img id="profileImage" class="profile-photo" src="https://via.placeholder.com/120" alt="Profile Photo">
    </label>
    <input type="file" id="uploadInput" accept="image/*">

    <div class="profile-details" id="profileDetails">
      <!-- User details will be populated here -->
    </div>

    <button id="logoutLink">Logout</button>
  </div>

  <script>
    // Load user data
    const data2 = JSON.parse(localStorage.getItem("FirstandLastNames")) || [];
    const profileDetails = document.getElementById("profileDetails");

    if (data2.length > 0) {
      data2.forEach(val => {
        profileDetails.innerHTML = `
          <p><strong>Name:</strong> ${val.name}</p>
          <p><strong>First Name:</strong> ${val.firstname}</p>
          <p><strong>Last Name:</strong> ${val.lastname}</p>
        `;
      });
    } else {
      profileDetails.innerHTML = `<p>No user data found.</p>`;
    }

    // Load and display saved profile image
    const savedImage = localStorage.getItem("profileImage");
    if (savedImage) {
      document.getElementById("profileImage").src = savedImage;
    }

    // Upload and save new profile image
    const uploadInput = document.getElementById("uploadInput");
    uploadInput.addEventListener("change", function(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imgSrc = e.target.result;
          document.getElementById("profileImage").src = imgSrc;
          localStorage.setItem("profileImage", imgSrc); // Save to localStorage
        };
        reader.readAsDataURL(file);
      }
    });

    // Logout button
    document.getElementById("logoutLink").addEventListener("click", () => {
      localStorage.clear();
      alert("You have been logged out!");
      window.location.href = "index.html"; // redirect to homepage
    });
  </script>

</body>
</html>
