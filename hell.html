<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Premium Catering Services</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f9fa;
    }

    .navbar-brand {
      font-weight: bold;
    }

    .feature-scroll {
      overflow-x: auto;
      white-space: nowrap;
      padding: 1rem;
      background-color: #fff;
    }

    .feature-scroll img {
      height: 120px;
      margin-right: 1rem;
      border-radius: 10px;
      transition: transform 0.3s ease;
    }

    .feature-scroll img:hover {
      transform: scale(1.05);
    }

    .category-buttons button {
      margin: 0.25rem;
    }

    .product-card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 1rem;
      background: #fff;
      margin-bottom: 1.5rem;
    }

    footer {
      background: #343a40;
      color: white;
      padding: 2rem 0;
    }

    .carousel-caption {
      background: rgba(0, 0, 0, 0.5);
      border-radius: 10px;
    }

    .card-title {
      font-size: 1.25rem;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="#">CateringPro</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
      </ul>
      <button class="btn btn-outline-light me-2" id="loginBtn">Login</button>
      <button class="btn btn-outline-danger d-none" id="logoutBtn">Logout</button>
    </div>
  </div>
</nav>

<!-- Feature Scroll Section -->
<section class="feature-scroll">
  <img src="projectimg1.jpeg" alt="Catering">
  <img src="projectimg2.jpeg" alt="Dessert">
  <img src="projectimg3.jpeg" alt="Party Food">
  <img src="buffet1.jpg" alt="Chef">
</section>

<!-- Categories & Search -->
<div class="container my-4">
  <div class="text-center mb-3">
    <div class="category-buttons">
      <button class="btn btn-outline-primary">All</button>
      <button class="btn btn-outline-primary">Veg</button>
      <button class="btn btn-outline-primary">Non-Veg</button>
      <button class="btn btn-outline-primary">Desserts</button>
    </div>
  </div>
  <input type="text" id="searchBar" class="form-control mb-4" placeholder="Search services..."/>
</div>

<!-- Carousel -->
<div id="mainCarousel" class="carousel slide mb-4" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="prod1.jpeg" class="d-block w-100" alt="...">
      <div class="carousel-caption d-none d-md-block">
        <h5>Elegant Catering Services</h5>
        <p>We serve quality and professionalism.</p>
      </div>
    </div>
    <div class="carousel-item">
      <img src="prod2.jpeg" class="d-block w-100" alt="...">
      <div class="carousel-caption d-none d-md-block">
        <h5>Delicious Buffets</h5>
        <p>Perfect for weddings and large events.</p>
      </div>
    </div>
  </div>
</div>

<!-- Product Listings -->
<div class="container">
  <div class="row" id="productList">
    <!-- Cards will be dynamically inserted here -->
  </div>
</div>

<!-- Booking Modal -->
<div class="modal fade" id="bookingModal" tabindex="-1" aria-labelledby="bookingModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form class="modal-content" id="bookingForm">
      <div class="modal-header">
        <h5 class="modal-title" id="bookingModalLabel">Book Service</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="selectedProductId" />
        <div class="mb-3">
          <label for="userName" class="form-label">Full Name</label>
          <input type="text" id="userName" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="userPhone" class="form-label">Phone Number</label>
          <input type="tel" id="userPhone" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="userCard" class="form-label">Card Number</label>
          <input type="text" id="userCard" class="form-control" placeholder="1234 5678 9012 3456" required />
        </div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">Confirm Booking</button>
      </div>
    </form>
  </div>
</div>

<!-- Footer -->
<footer class="text-center">
  <div class="container">
    <p class="mb-1">© 2025 CateringPro. All rights reserved.</p>
    <p class="mb-0">Follow us on
      <a href="#" class="text-white mx-1">Facebook</a> |
      <a href="#" class="text-white mx-1">Instagram</a> |
      <a href="#" class="text-white mx-1">Twitter</a>
    </p>
  </div>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

<script>
  // Firebase config
  const firebaseConfig = {
                apiKey: "AIzaSyCV1eiwKVZs1inaWkVTYVsisI3sIIlAGL0",
                authDomain: "crud-dd0b4.firebaseapp.com",
                projectId: "crud-dd0b4",
                storageBucket: "crud-dd0b4.firebasestorage.app",
                messagingSenderId: "818921146981",
                appId: "1:818921146981:web:dbbdba5635bcdf78d3548c"
              };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  // Dummy logic for login/logout
  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');

  loginBtn.addEventListener('click', () => {
    auth.signInAnonymously().then(() => {
      loginBtn.classList.add('d-none');
      logoutBtn.classList.remove('d-none');
    });
  });

  logoutBtn.addEventListener('click', () => {
    auth.signOut().then(() => {
      loginBtn.classList.remove('d-none');
      logoutBtn.classList.add('d-none');
    });
  });

  // Load products from Firestore
  const productList = document.getElementById('productList');
  db.collection('products').onSnapshot(snapshot => {
    productList.innerHTML = '';
    snapshot.forEach(doc => {
      const data = doc.data();
      productList.innerHTML += `
        <div class="col-md-4">
          <div class="product-card">
            <h5 class="card-title">${data.name}</h5>
            <p>${data.description}</p>
            <p><strong>Price:</strong> ₹${data.price}</p>
            <button class="btn btn-sm btn-success" data-id="${doc.id}" data-bs-toggle="modal" data-bs-target="#bookingModal">Book Now</button>
          </div>
        </div>`;
    });

    // Attach event listeners for "Book Now"
    document.querySelectorAll('.btn-success').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('selectedProductId').value = btn.getAttribute('data-id');
      });
    });
  });

  // Handle booking form
  const bookingForm = document.getElementById('bookingForm');
  bookingForm.addEventListener('submit', e => {
    e.preventDefault();
    const bookingData = {
      name: document.getElementById('userName').value,
      phone: document.getElementById('userPhone').value,
      card: document.getElementById('userCard').value,
      productId: document.getElementById('selectedProductId').value,
      bookedAt: new Date()
    };
    db.collection('bookings').add(bookingData).then(() => {
      alert('Booking Confirmed!');
      bookingForm.reset();
      const modal = bootstrap.Modal.getInstance(document.getElementById('bookingModal'));
      modal.hide();
    });
  });
</script>

</body>
</html>
