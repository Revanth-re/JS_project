<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Booking Modal Example</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f7fc;
      color: #333;
      line-height: 1.6;
    }

    /* Button to open the modal */
    .open-modal-btn {
      padding: 0.8rem 1.5rem;
      background-color: #007bff;
      color: white;
      font-size: 1.2rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .open-modal-btn:hover {
      background-color: #0056b3;
    }

    /* The Modal */
    .modal {
      display: none; /* Hidden by default */
      position: fixed;
      z-index: 1; /* Sit on top */
      left: 0;
      top: 0;
      width: 100%; /* Full width */
      height: 100%; /* Full height */
      overflow: auto; /* Enable scroll if needed */
      background-color: rgba(0, 0, 0, 0.4); /* Black with opacity */
    }

    /* Modal Content */
    .modal-content {
      background-color: #fff;
      margin: 15% auto;
      padding: 20px;
      border-radius: 10px;
      width: 70%; /* Set the width of the modal */
      max-width: 600px;
    }

    /* Close Button */
    .close-btn {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    .close-btn:hover,
    .close-btn:focus {
      color: black;
      text-decoration: none;
    }

    /* Form Styling */
    .modal-form input,
    .modal-form select {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .modal-form button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    .modal-form button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <!-- Button to open the modal -->
  <button class="open-modal-btn">Book Catering</button>

  <!-- The Modal -->
  <div id="bookingModal" class="modal">

    <!-- Modal Content -->
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h2>Book Catering Service</h2>
      
      <!-- Booking Form -->
      <form class="modal-form">
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>

        <label for="cardType">Card Type:</label>
        <select id="cardType" name="cardType" required>
          <option value="">Select Card Type</option>
          <option value="credit">Credit Card</option>
          <option value="debit">Debit Card</option>
        </select>

        <label for="cardNumber">Card Number:</label>
        <input type="text" id="cardNumber" name="cardNumber" placeholder="Enter your card number" required>

        <label for="date">Booking Date:</label>
        <input type="date" id="date" name="date" required>

        <button type="submit">Confirm Booking</button>
      </form>
    </div>

  </div>

  <script>
    // Get the modal
    var modal = document.getElementById("bookingModal");

    // Get the button that opens the modal
    var btn = document.querySelector(".open-modal-btn");

    // Get the <span> element that closes the modal
    var span = document.querySelector(".close-btn");

    // When the user clicks the button, open the modal
    btn.addEventListener("click", function() {
      modal.style.display = "block";
    });

    // When the user clicks on <span> (x), close the modal
    span.addEventListener("click", function() {
      modal.style.display = "none";
    });

    // When the user clicks anywhere outside of the modal, close it
    window.addEventListener("click", function(event) {
      if (event.target === modal) {
        modal.style.display = "none";
      }
    });
  </script>

</body>
</html>
