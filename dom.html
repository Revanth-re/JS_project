<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Function Booking App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    .product-card {
      border: 1px solid #ddd;
      border-radius: 15px;
      padding: 16px;
      margin: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 300px;
      background-color: #fff;
    }
    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
    }
    .product-card h3 {
      font-size: 1.25rem;
      margin-top: 10px;
    }
    #productList {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
  </style>
</head>
<body>

  <div class="container mt-5">
    <h1 class="text-center mb-4">All Products</h1>

    <!-- Category Buttons -->
    <section class="mb-5">
      <h2 class="text-center mb-4">Explore by Category</h2>
      <div id="categoryButtons" class="d-flex flex-wrap justify-content-center gap-3">
        <button class="btn btn-dark category-btn" data-category="all">All</button>
        <button class="btn btn-outline-dark category-btn" data-category="marriage">Marriage</button>
        <button class="btn btn-outline-dark category-btn" data-category="anniversary">Anniversary</button>
        <button class="btn btn-outline-dark category-btn" data-category="birthday">Birthday</button>
        <button class="btn btn-outline-dark category-btn" data-category="family">Family Parties</button>
        <button class="btn btn-outline-dark category-btn" data-category="private">Private Parties</button>
        <button class="btn btn-outline-dark category-btn" data-category="sports">Sports Parties</button>
        <button class="btn btn-outline-dark category-btn" data-category="fruit">Fruit Parties</button>
        <button class="btn btn-outline-dark category-btn" data-category="mixed">Mixed Parties</button>
      </div>
    </section>

    <!-- Product List -->
    <div id="productList"></div>
  </div>

  <!-- Firebase + App Script -->
  <script type="module">
    // Firebase setup
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

    const firebaseConfig = {
      

      
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allProducts = [];

    async function fetchAllProducts() {
      const q = query(collection(db, "productsList"));
      const querySnapshot = await getDocs(q);
      const productList = document.getElementById("productList");
      productList.innerHTML = "";
      allProducts = [];

      querySnapshot.forEach((doc) => {
        const data = doc.data();
        allProducts.push(data);
      });

      displayProducts(allProducts);
    }

    function displayProducts(products) {
      const productList = document.getElementById("productList");
      productList.innerHTML = "";

      products.forEach((productData) => {
        const productCard = document.createElement("div");
        productCard.classList.add("product-card");

        const productName = document.createElement("h3");
        productName.textContent = productData.name;

        const productPrice = document.createElement("p");
        productPrice.textContent = `Price: ₹${productData.price}`;

        const productDesc = document.createElement("p");
        productDesc.textContent = `Description: ${productData.description}`;

        const productCategory = document.createElement("p");
        productCategory.textContent = `Category: ${productData.category}`;

        const productStock = document.createElement("p");
        productStock.textContent = `Stock: ${productData.stock}`;

        const productImage = document.createElement("img");
        productImage.src = productData.image || `https://source.unsplash.com/400x300/?${productData.category},party`;
        productImage.alt = productData.name;

        const callButton = document.createElement("a");
        callButton.innerText = "Call us";
        callButton.href = "tel:" + productData.num;
        callButton.classList.add("btn", "btn-primary", "mt-2", "me-2");

        const payButton = document.createElement("button");
        payButton.innerText = "Pay in Advance";
        payButton.classList.add("btn", "btn-success", "mt-2");

        productCard.append(productImage, productName, productPrice, productDesc, productCategory, productStock, callButton, payButton);
        productList.appendChild(productCard);
      });
    }

    // Category Filter Logic
    document.getElementById("categoryButtons").addEventListener("click", function (e) {
      if (e.target.classList.contains("category-btn")) {
        const selectedCategory = e.target.getAttribute("data-category").toLowerCase();
        if (selectedCategory === "all") {
          displayProducts(allProducts);
        } else {
          const filtered = allProducts.filter(p => p.category && p.category.toLowerCase().includes(selectedCategory));
          displayProducts(filtered);
        }
      }
    });

    fetchAllProducts();
  </script>

</body>
</html>
