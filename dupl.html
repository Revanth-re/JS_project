<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elite Catering</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-warning" href="#">Elite Catering</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
          <li class="nav-item"><a class="nav-link" href="#" id="loginBtn">Login</a></li>
          <li class="nav-item"><a class="nav-link d-none" href="#" id="logoutBtn">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Carousel -->
  <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="prod2.jpeg" class="d-block w-100" alt="Delicious Catering">
        <div class="carousel-caption d-none d-md-block">
          <h2>Premium Catering for Every Occasion</h2>
          <p>Elegant. Exceptional. Elite.</p>
        </div>
      </div>
      <div class="carousel-item">
        <img src="prod1.jpeg" class="d-block w-100" alt="Catering Service">
        <div class="carousel-caption d-none d-md-block">
          <h2>Bringing Flavor to Your Events</h2>
          <p>Freshly made, beautifully served.</p>
        </div>
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <!-- Category Buttons -->
  <div class="container text-center my-4">
    <button class="btn btn-outline-dark mx-1 filter-btn" data-category="All">All</button>
    <button class="btn btn-outline-dark mx-1 filter-btn" data-category="Catering">Catering</button>
    <button class="btn btn-outline-dark mx-1 filter-btn" data-category="Decorations">Decorations</button>
    <button class="btn btn-outline-dark mx-1 filter-btn" data-category="Photography">Photography</button>
  </div>

  <!-- Search Bar -->
  <div class="container mb-4">
    <input type="text" class="form-control" id="searchBar" placeholder="Search for a service...">
  </div>

  <!-- Products Section -->
  <div class="container mb-5">
    <div id="productList" class="row g-4"></div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white py-4">
    <div class="container text-center">
      <p class="mb-1">© 2025 Elite Catering. All rights reserved.</p>
      <small>Designed with ♥ by Elite Team</small>
    </div>
  </footer>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-firestore-compat.js"></script>

  <!-- Bootstrap Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Main JS -->
  <script src="duplicate.js"></script>
</body>
</html>
