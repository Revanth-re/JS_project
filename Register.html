<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up / Login</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f4f7fc;
      margin: 0;
      padding: 0;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-top: 4vh;
      font-size: 1.5em;
    }

    .container {
      width: 88%;
      max-width: 340px;
      margin: 4vh auto;
      background-color: #fff;
      padding: 4vw;
      border-radius: 0.75em;
      box-shadow: 0 0.5em 1.2em rgba(0, 0, 0, 0.1);
    }

    input {
      width: 100%;
      padding: 0.75em;
      margin: 0.75em 0;
      border: 1px solid #ccc;
      border-radius: 0.4em;
      font-size: 0.95em;
    }

    button {
      width: 100%;
      padding: 0.9em;
      margin-top: 1em;
      background-color: #4CAF50;
      border: none;
      color: white;
      font-size: 0.95em;
      border-radius: 0.4em;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #45a049;
    }

    .google-btn {
      background-color: #4285F4;
      color: white;
      font-size: 0.95em;
      border-radius: 0.4em;
      padding: 0.9em;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 1.2em;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .google-btn:hover {
      background-color: #357AE8;
    }

    .google-icon {
      margin-right: 0.5em;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 0.8em;
      color: #333;
      text-decoration: none;
      font-size: 0.9em;
    }

    a:hover {
      text-decoration: underline;
    }

    #logout {
      margin-top: 1em;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Sign Up</h2>

    <div class="form-container">
      <input type="text" id="first" placeholder="Enter first name">
      <input type="text" id="second" placeholder="Last name">
      <input type="email" id="signupEmail" placeholder="Email" required />
      <input type="password" id="signupPassword" placeholder="Password" required />
      <button id="btn1">Sign Up</button>
      <a href="login.html">Already have an account? Login</a>
    </div>

    <button id="logout">Logout</button>

    <!-- Google Sign-In Button -->
    <!-- <div class="google-btn" id="googleBtn">
      <span class="google-icon">🔒</span> Sign Up with Google
    </div> -->
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCV1eiwKVZs1inaWkVTYVsisI3sIIlAGL0",
      authDomain: "crud-dd0b4.firebaseapp.com",
      projectId: "crud-dd0b4",
      storageBucket: "crud-dd0b4.firebasestorage.app",
      messagingSenderId: "818921146981",
      appId: "1:818921146981:web:dbbdba5635bcdf78d3548c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, user => {
      const logoutBtn = document.getElementById("logout");

      if (user) {
        const first = document.getElementById("first").value;
        const second = document.getElementById("second").value;

        let userDetails = {
          firstname: first,
          lastname: second,
          email: user.email
        };

        localStorage.setItem("userdetails", JSON.stringify([userDetails]));
        window.location.href = "mainn.html";
      } else {
        console.log("User not logged in");
      }
    });

    document.getElementById("btn1").addEventListener("click", function () {
      const first = document.getElementById("first").value;
      const second = document.getElementById("second").value;
      const email = document.getElementById("signupEmail").value;
      const password = document.getElementById("signupPassword").value;

      createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          alert("Sign up successful!");
          window.location.href = "login.html";
        })
        .catch((error) => {
          alert("Sign up failed: " + error.message);
        });
    });

    document.getElementById("googleBtn").addEventListener("click", function () {
      const provider = new GoogleAuthProvider();

      signInWithPopup(auth, provider)
        .then((result) => {
          alert("Google Sign-In successful!");
          window.location.href = "index.html";
        })
        .catch((error) => {
          alert("Google Sign-In failed: " + error.message);
        });
    });
  </script>

</body>
</html>
