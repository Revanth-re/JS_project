<!DOCTYPE html>

    <title>Simple Form</title>
    <style>
           * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7fc;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      text-align: center;
      margin-bottom: 2rem;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #333;
      padding: 1rem 2rem;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
    }

    .logo a {
      color: white;
      font-size: 2rem;
      text-decoration: none;
    }

    .nav-links {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
    }

    .nav-links li {
      margin: 0 1rem;
    }

    .nav-links a {
      color: rgb(245, 242, 242);
      text-decoration: none;
      font-size: 1rem;
      padding: 0.5rem;
      transition: background-color 0.3s ease;
    }

    .nav-links a:hover {
      background-color: #575757;
      border-radius: 0.5rem;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 4px;
      width: 30px;
      height: 25px;
      position: absolute;
      right: 1rem;
      top: 1rem;
      cursor: pointer;
    }

    .hamburger div {
      background-color: white;
      height: 4px;
      width: 100%;
      transition: all 0.3s ease;
    }

    .admin-banner-premium {
      min-height: 100vh;
      background: linear-gradient(to bottom right, #1f1c2c, #928dab),
                  url('https://images.unsplash.com/photo-1555243896-c709bfa0b564?auto=format&fit=crop&w=1470&q=80') center/cover no-repeat;
      position: relative;
      overflow: hidden;
      padding: 4rem 1rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    #sectionCenter {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
      width: 100%;
    }

    #AdminInp {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 1rem;
      padding: 2rem;
      max-width: 350px;
      width: 100%;
      backdrop-filter: blur(10px);
    }

    #AdminInp h2 {
      color: white;
      margin-bottom: 1.5rem;
      font-size: 1.3rem;
    }

    input, button {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border-radius: 0.5rem;
      font-size: 1rem;
    }

    input {
      border: 1px solid #ccc;
      text-align: center;
    }

    button {
      border: none;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #45a049;
    }

    #btnDeleteProduct {
      background-color: red;
    }

    #btnUpdateProduct {
      background-color: blue;
    }

    @media (max-width: 768px) {
      .nav-links {
        flex-direction: column;
        display: none;
        width: 100%;
        margin-top: 1rem;
      }

      .nav-links.active {
        display: flex;
      }

      .nav-links li {
        margin: 1rem 0;
        text-align: center;
      }

      .hamburger {
        display: flex;
      }

      body {
        padding: 1rem;
      }

      .navbar {
        flex-wrap: wrap;
        padding: 1rem;
      }

      #sectionCenter {
        flex-direction: column;
        align-items: center;
      }

      #AdminInp {
        width: 100%;
        max-width: 95%;
      }
    }@media (max-width: 768px) {
  .nav-links {

    background-color:white;
    padding: 3rem;
    border-radius: 0.5rem;
    width: auto;
    z-index: 1000;
    margin-top: -2%;
   margin-right: -5%;
  }
  .nav-links.active {
    display: flex;
  }
  .nav-links li {
    margin: 1.3rem 0;
    text-align: right;
    color: black;
  }
  .hamburger {
    display: flex;
  }
  .nav-links li a{
font-size: 1.3rem;
  }

}

    </style>
</head>

  <section id="sectionCenter" class="admin-banner-premium">
    <div id="AdminInp">
      <input type="text" placeholder="Enter-your-Name" id="inpProductName">
        <input type="text" placeholder="Enter-Required-Day" id="inpProductDesc">
        <input type="number" placeholder="Enter Payage" id="inpProductPrice">
        <input type="number" placeholder="Enter-Boys-Count" id="inpProductCategory">
        <input type="text" placeholder="Enter timings" id="inpStockQuantity">
        <input type="text" placeholder="Location or area" id="location">
        <input type="number" placeholder="Enter Contact Number" id="number">
        <button id="btnAddProduct">Add Product</button>
    </div>

    <div id="AdminInp">
      <h2>Update Your CaterService Details</h2>
    <input type="text" placeholder="Update - Enter Cater Name" id="inpSearchName">
        <input type="text" placeholder="Enter New Description" id="inpNewProductDesc">
        <input type="text" placeholder="Enter New Category" id="inpNewProductcategory">
        <input type="number" placeholder="Enter New Price" id="inpNewProductPrice">
        <input type="text" placeholder="Enter new timings" id="inpnewStockQuantity">
        <button id="btnUpdateProduct">Update Product</button>
    </div>

    <div id="AdminInp">
      <h2>Delete Your CaterService Details</h2>
     
        <input type="text" placeholder="Enter Cater Name to Delete" id="inpDeleteName">
        <button id="btnDeleteProduct">Delete Product</button>
    </div>
  </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getFirestore, addDoc, collection, query, where, getDocs, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCV1eiwKVZs1inaWkVTYVsisI3sIIlAGL0",
            authDomain: "crud-dd0b4.firebaseapp.com",
            projectId: "crud-dd0b4",
            storageBucket: "crud-dd0b4.appspot.com",
            messagingSenderId: "818921146981",
            appId: "1:818921146981:web:dbbdba5635bcdf78d3548c"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        let currentUser = null;
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
        });
        
        document.getElementById("btnAddProduct").addEventListener("click", async () => {
            const productName = document.getElementById("inpProductName").value.trim();
            const productDesc = document.getElementById("inpProductDesc").value.trim();
            const productPrice = document.getElementById("inpProductPrice").value.trim();
            const productCategory = document.getElementById("inpProductCategory").value.trim();

            const stockQuantity = document.getElementById("inpStockQuantity").value.trim();
            const location = document.getElementById("location").value.trim();

            const contactNumber = document.getElementById("number").value.trim();
            const fileInput = document.getElementById("inpProductImage");
         
            try {
             
                await addDoc(collection(db, "servdetails"), {
                    name: productName,
                    functionType: productDesc,
                    price: Number(productPrice),
                    description: productCategory,
                    items: stockQuantity,
                   
                    contact: contactNumber,
                    location:location
                });
                alert("Product added successfully!");
            
            } catch (error) {
                console.error("Error adding product:", error);
                alert("Error adding product.");
            }
        });
        
        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = (error) => reject(error);
                reader.readAsDataURL(file);
            });
        }
        
        document.getElementById("btnUpdateProduct").addEventListener("click", async () => {
            const searchName = document.getElementById("inpSearchName").value.trim();
            const newDesc = document.getElementById("inpNewProductDesc").value.trim();
            const newCategory = document.getElementById("inpNewProductcategory").value.trim();
            const newPrice = document.getElementById("inpNewProductPrice").value.trim();
            const newItems = document.getElementById("inpnewStockQuantity").value.trim();
        
            if (!searchName || !newDesc || !newPrice) {
                alert("Please fill all fields.");
                return;
            }
        
            try {
                const q = query(collection(db, "servdetails"), where("name", "==", searchName));
                const querySnapshot = await getDocs(q);
        
                if (querySnapshot.empty) {
                    alert("No product found.");
                    return;
                }
        
                for (let docSnap of querySnapshot.docs) {
                    await updateDoc(docSnap.ref, {
                        description: newDesc,
                        category: newCategory,
                        price: Number(newPrice),
                        items: newItems
                    });
                }
        
                alert("Product updated successfully!");
            } catch (error) {
                console.error("Update error:", error);
                alert("Error updating product.");
            }
        });
        
        document.getElementById("btnDeleteProduct").addEventListener("click", async () => {
            const deleteName = document.getElementById("inpDeleteName").value.trim();
            if (!deleteName) {
                alert("Please enter a product name to delete.");
                return;
            }
        
            try {
                const q = query(collection(db, "servdetails"), where("name", "==", deleteName));
                const querySnapshot = await getDocs(q);
        
                if (querySnapshot.empty) {
                    alert("No product found.");
                    return;
                }
        
                for (let docSnap of querySnapshot.docs) {
                    await deleteDoc(docSnap.ref);
                }
        
                alert("Product deleted successfully!");
            } catch (error) {
                console.error("Delete error:", error);
                alert("Error deleting product.");
            }
        });
        </script>
