<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        /* General page styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #5c6bc0;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #5c6bc0;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #3f4a99;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            color: #5c6bc0;
            text-decoration: none;
            font-size: 14px;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Register</h2>
<input type="text" id="first" >
<input type="text" id="second" >

        <input type="email" id="signupEmail" placeholder="Email" required />
        <input type="password" id="signupPassword" placeholder="Password" required />
        <button id="btn1">Sign Up</button>
        <a href="Adminlogin.html">Already have an account? Login</a>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword,onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCV1eiwKVZs1inaWkVTYVsisI3sIIlAGL0",
            authDomain: "crud-dd0b4.firebaseapp.com",
            projectId: "crud-dd0b4",
            storageBucket: "crud-dd0b4.firebasestorage.app",
            messagingSenderId: "818921146981",
            appId: "1:818921146981:web:dbbdba5635bcdf78d3548c"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        onAuthStateChanged(auth, user => {
            const loginLink = document.getElementById("loginLink");
            if (user) {
                // loginLink.innerText = "Profile";
                // loginLink.setAttribute("href", "profile.html");
                const first=document.getElementById("first").value
                const second=document.getElementById('second').value
                let arr2=[]
                let obj2={firstname:first,
                    lastname:second,
                    name:user.email,
             
                }
                arr2.push(obj2)
              const local2=localStorage.setItem("FirstandLastNames",JSON.stringify(arr2))



  window.location.href="AdminLogin.html"

            } else {
                loginLink.innerText = "Login";
                loginLink.setAttribute("href", "Register.html");
                document.getElementById("logoutLink").style.display = 'none';
            }
        });


        const btn1 = document.getElementById("btn1");
        btn1.addEventListener("click", func);

        function func() {
            // const first=document.getElementById("first").value
            // const second=document.getElementById('second').value
            const email = document.getElementById("signupEmail").value;
            const password = document.getElementById("signupPassword").value;
            console.log(email, password);

            createUserWithEmailAndPassword(auth, email, password,first,second)
                .then((userCredential) => {
                    const user = userCredential.user;
                    console.log(user);

                    // Store the user's UID in localStorage
                    localStorage.setItem('uid', user.uid);

                    alert("Sign up successful!");
                    window.location.href = "Adminlogin.html"; // Redirect to login page 
                })
                .catch((error) => {
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    console.log(error);
                    alert("Sign up failed: " + errorMessage);
                });
        }
    </script>
</body>
</html>
