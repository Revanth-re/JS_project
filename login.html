<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7fc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 25rem;
      background: #fff;
      padding: 2rem;
      border-radius: 0.75rem;
      box-shadow: 0 0.5rem 1.25rem rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #333;
      font-size: 1.5rem;
    }

    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      margin: 0.625rem 0;
      border: 1px solid #ccc;
      border-radius: 0.375rem;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1rem;
      background-color: #fdc656;;
      border: none;
      color: white;
      font-size: 1rem;
      border-radius: 0.375rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #45a049;
    }

    .register-link {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: #4CAF50;
      text-decoration: none;
      font-size: 0.95rem;
    }

    .register-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      html {
        font-size: 14px;
      }

      .container {
        padding: 1.5rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Login</h2>
    <input type="email" id="loginEmail" placeholder="Email" required />
    <input type="password" id="loginPassword" placeholder="Password" required />
    <button id="btnLogin">Login</button>
    <a href="Register.html" class="register-link">Create an account? Register</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCV1eiwKVZs1inaWkVTYVsisI3sIIlAGL0",
      authDomain: "crud-dd0b4.firebaseapp.com",
      projectId: "crud-dd0b4",
      storageBucket: "crud-dd0b4.appspot.com",
      messagingSenderId: "818921146981",
      appId: "1:818921146981:web:dbbdba5635bcdf78d3548c"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Login button listener
    document.getElementById("btnLogin").addEventListener("click", async (e) => {
      e.preventDefault();

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value.trim();

      if (email === "" || password === "") {
        alert("Please fill in both email and password.");
        return;
      }

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        alert("Login successful!");
        window.location.href = "mainn.html"; // Redirect after login
      } catch (error) {
        console.error(error.code, error.message);
        alert(error.message); // Show exact Firebase error
      }
    });

    // Optional: Listen to authentication state changes
    onAuthStateChanged(auth, (user) => {
      if (user) {
        console.log("User is logged in:", user.email);
      } else {
        console.log("User is logged out");
      }
    });
  </script>
</body>
</html>
